{% extends "base.html" %}
{% block titulo %}Eliminar {{ equipo.nombre }} · Equipos{% endblock %}
{% block contenido %}
<h1>¿Eliminar "{{ equipo.nombre }}"?</h1>
<p class="aviso">Esta acción no se puede deshacer.</p>
<form method="post">
  {% csrf_token %}
  <button type="submit">Sí, eliminar</button>
  <a href="{% url 'equipos:detail' equipo.id %}">Cancelar</a>
</form>
{% endblock %}
