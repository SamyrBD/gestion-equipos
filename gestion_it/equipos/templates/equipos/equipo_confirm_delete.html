{% extends "base.html" %}
{% block titulo %}Eliminar {{ equipo.nombre }} | Equipos{% endblock %}
{% block contenido %}
<h1>¿Eliminar "{{ equipo.nombre }}"?</h1>
<p class="aviso aviso-error">Esta acción no se puede deshacer.</p>
<form method="post" class="acciones">
  {% csrf_token %}
  <button type="submit" class="btn-peligro">Sí, eliminar equipo</button>
  <a href="{% url 'equipos:detail' equipo.id %}">Cancelar</a>
</form>
{% endblock %}
