{% extends "base.html" %}
{% block titulo %}{{ accion }} equipo · Equipos{% endblock %}
{% block contenido %}
<h1>{{ accion }} equipo</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Guardar</button>
  {% if equipo %}
    <a href="{% url 'equipos:detail' equipo.id %}">Cancelar</a>
  {% else %}
    <a href="{% url 'equipos:index' %}">Cancelar</a>
  {% endif %}
</form>
{% endblock %}
