; Un solo contenedor, varios procesos. supervisord los lanza, los vigila
; y los reinicia si se caen. Solo gestion_ti usa el puerto público de Render.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; --- Aplicación principal (puerto público que entrega Render) ------------------
[program:gestion_ti]
directory=/app/gestion_ti
command=gunicorn gestion.wsgi --bind 0.0.0.0:%(ENV_PORT)s --workers 1 --threads 4 --timeout 60
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; --- ① CONSULTA principal (Python, Django Ninja) :8001 -------------------------
[program:consulta_python]
directory=/app/microservicio_mantenimientos
command=gunicorn microservicio.wsgi --bind 127.0.0.1:8001 --workers 1 --threads 2 --timeout 60
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; --- ② CONSULTA de respaldo (Go) :8002 -----------------------------------------
[program:consulta_go]
directory=/app
command=/app/bin/consulta_go
environment=PORT="8002",GOMEMLIMIT="32MiB"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; --- ③ INSERTAR principal (Node.js) :8003 --------------------------------------
[program:insertar_node]
directory=/app/ms_node
command=node --max-old-space-size=48 insertar.js
environment=PORT="8003"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; --- ④ ACTUALIZAR principal (Node.js) :8004 ------------------------------------
